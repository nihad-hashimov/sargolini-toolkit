[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sargolini-toolkit"
version = "0.1.0"
description = "Loader and cell classification for the Sargolini et al. 2006 grid-cell recordings"
readme = "README.md"
requires-python = ">=3.14,<3.15"   # results in results/ were produced with CPython 3.14.6
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "gridcan @ git+https://github.com/nihad-hashimov/gridcan",
    "numpy==2.5.2",
    "scipy==1.18.0",
    "matplotlib==3.11.1",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools]
packages = ["sargolini_toolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
